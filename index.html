<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Hunter System</title>
<meta name="theme-color" content="#05070C" />
<link rel="manifest" href="./manifest.json" />
<style>
  :root {
    --void: #05070C;
    --panel: #0C1220;
    --border: #1B2A45;
    --blue: #2ED3FF;
    --purple: #8B6FFF;
    --text: #DCEFFF;
    --dim: #5E7291;
    --green: #4ADE80;
    --gold: #FFD166;
    --orange: #FF9F5A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--void); overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    position: relative;
  }
  #bgcanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.55; }
  #bgwash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    background: radial-gradient(ellipse at 50% -10%, #0D1830 0%, #05070C 55%); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; }
  .sys { font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; }
  input:focus, button:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  input[type=number] { -moz-appearance: textfield; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  button { -webkit-user-select: none; user-select: none; }
  button:active { transform: scale(0.97); }

  /* ---- Boot sequence ---- */
  #boot {
    position: fixed; inset: 0; z-index: 999; background: #05070C;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
  }
  #boot.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .boot-line { font-family: ui-monospace, monospace; font-size: 13px; color: var(--blue); opacity: 1;
    margin-bottom: 8px; letter-spacing: 1px; text-shadow: 0 0 10px rgba(46,211,255,0.6); animation: bootFade 0.5s ease-out; }
  @keyframes bootFade { from { transform: translateY(6px); } to { transform: translateY(0); } }
  .boot-bar { width: 200px; height: 3px; background: #0F1830; border: 1px solid var(--border); margin-top: 16px; overflow: hidden; border-radius: 2px; }
  .boot-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--blue), var(--purple)); animation: bootLoad 1.6s ease-in-out forwards; animation-delay: 0.3s; }
  @keyframes bootLoad { to { width: 100%; } }

  /* ---- Entrance / transition animations ---- */
  @keyframes fadeInUp { from { transform: translateY(10px); } to { transform: translateY(0); } }
  @keyframes mainFade { from { opacity: 0; } to { opacity: 1; } }
  .main-fade { animation: mainFade 0.35s ease-out; }
  .card-in { opacity: 0; transform: translateY(10px); transition: opacity 0.35s ease-out, transform 0.35s ease-out; }
  .card-in.show { opacity: 1; transform: translateY(0); }

  @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 0 24px -8px var(--g1, rgba(46,211,255,0.4)), inset 0 0 40px -20px var(--g2, rgba(46,211,255,0.2)); }
    50% { box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 0 34px -6px var(--g1b, rgba(46,211,255,0.53)), inset 0 0 50px -18px var(--g2b, rgba(46,211,255,0.27)); } }

  @keyframes scanSweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .win-scan { position: absolute; top: 0; left: 0; width: 40%; height: 1px;
    background: linear-gradient(90deg, transparent, currentColor, transparent); opacity: 0.5;
    animation: scanSweep 3.5s linear infinite; }

  @keyframes ringPulse { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(2.4); opacity: 0; } }
  .level-ring { position: absolute; top: 50%; left: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px;
    border: 2px solid var(--blue); border-radius: 50%; animation: ringPulse 1.4s ease-out infinite; }
  @keyframes levelPop { 0% { transform: scale(0.7); opacity: 0; } 55% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  @keyframes shimmer { 0% { background-position: -120px 0; } 100% { background-position: 220px 0; } }
  .bar-shimmer::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    background-size: 80px 100%; background-repeat: no-repeat; animation: shimmer 2.2s ease-in-out infinite; }

  @keyframes checkPop { 0% { transform: scale(0); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }

  .header { padding: 26px 18px 16px; border-bottom: 1px solid var(--border); animation: fadeInUp 0.5s ease-out; }
  .header-row { display: flex; justify-content: space-between; align-items: center; }
  .header-sub { font-size: 10px; letter-spacing: 3px; color: var(--dim); }
  .header-title { margin: 2px 0 0; font-size: 24px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 12px rgba(46,211,255,0.5); }
  .header-date { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .rank-badge { text-align: right; }
  .rank-letter { font-size: 22px; font-weight: 900; animation: fadeInUp 0.6s ease-out; }
  .rank-label { font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .nav { display: flex; border-bottom: 1px solid var(--border); background: #080B12; position: sticky; top: 0; z-index: 10; }
  .nav button { flex: 1; padding: 13px 0; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--dim); font-size: 9.5px; letter-spacing: 1px; font-weight: 700; cursor: pointer; font-family: inherit; transition: color 0.2s, border-color 0.2s; }
  .nav button.active { color: var(--text); border-bottom: 2px solid var(--blue); }
  .main { padding: 18px; padding-bottom: 60px; position: relative; }
  .win { position: relative; background: linear-gradient(180deg, #0C1220 0%, #0A0F1A 100%); border-radius: 2px; padding: 18px; margin-bottom: 14px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 0 24px -8px var(--g1, rgba(46,211,255,0.4)), inset 0 0 40px -20px var(--g2, rgba(46,211,255,0.2)); }
  @media (prefers-reduced-motion: no-preference) {
    .win { animation: glowPulse 4s ease-in-out infinite; }
  }
  .win .corner { position: absolute; width: 12px; height: 12px; border-width: 2px; border-style: solid; }
  .section-label { font-size: 11px; letter-spacing: 3px; margin-bottom: 10px; font-weight: 700; text-transform: uppercase; }
  .stat-bar-row { margin-bottom: 12px; }
  .stat-bar-label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 11px; letter-spacing: 1.5px; color: #8FA3C4; }
  .stat-bar-track { height: 6px; background: #0F1830; border-radius: 3px; overflow: hidden; border: 1px solid var(--border); position: relative; }
  .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(.2,.9,.3,1); position: relative; overflow: hidden; }
  .mini-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .mini-stat { background: var(--panel); border: 1px solid var(--border); border-radius: 2px; padding: 12px 8px; text-align: center; transition: transform 0.2s; }
  .mini-stat .val { font-size: 17px; font-weight: 700; }
  .mini-stat .lbl { font-size: 9px; color: var(--dim); letter-spacing: 1px; margin-top: 3px; }
  .ex-card { border: 1px solid var(--border); border-radius: 2px; padding: 14px; margin-bottom: 10px; background: linear-gradient(180deg, #0C1220 0%, #0A0F1A 100%); position: relative; overflow: hidden; }
  .ex-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .ex-name { margin: 0; font-size: 15px; font-weight: 700; }
  .ex-target { font-size: 11px; color: var(--dim); }
  .ex-note { display: inline-block; font-size: 10px; color: var(--gold); letter-spacing: 0.5px; background: #1F1A0E; border: 1px solid #4A3F1E; border-radius: 2px; padding: 2px 8px; margin-bottom: 8px; }
  .suggest-box { border: 1px solid #131E33; border-left: 2px solid var(--blue); border-radius: 2px; padding: 8px 10px; margin-bottom: 10px; background: #080D18; }
  .suggest-label { font-size: 9px; letter-spacing: 1.5px; color: var(--dim); margin-bottom: 4px; }
  .suggest-line { font-size: 12px; line-height: 1.4; margin-bottom: 3px; }
  .plateau-line { font-size: 11px; color: var(--purple); margin-top: 2px; }
  .asym-line { font-size: 11px; color: var(--orange); margin-top: 2px; }
  .set-row { display: grid; grid-template-columns: 16px 1fr 12px 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }
  .set-idx { font-size: 11px; color: var(--dim); }
  .set-x { color: #3A4A6A; text-align: center; }
  .side-block { border: 1px solid #131E33; border-radius: 2px; padding: 8px; margin-bottom: 8px; }
  .side-block .set-idx-label { font-size: 10px; color: var(--dim); margin-bottom: 5px; }
  input.numfield { width: 100%; background: #080B12; border: 1px solid var(--border); border-radius: 2px; color: var(--text); padding: 7px 8px; font-size: 14px; text-align: center; font-family: inherit; transition: border-color 0.2s; }
  input.numfield:valid, input.numfield:not(:placeholder-shown) { border-color: #2A4A5A; }
  .quest-header { display: flex; justify-content: space-between; align-items: center; }
  .quest-count { font-size: 15px; }
  .day-badge { display: inline-block; font-size: 9px; letter-spacing: 1px; color: var(--dim); background: #0F1830; border: 1px solid var(--border); border-radius: 2px; padding: 2px 8px; margin-left: 8px; }
  .checklist-item { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--panel); border-radius: 2px; padding: 14px; margin-bottom: 10px; cursor: pointer; border-width: 1px; border-style: solid; font-family: inherit; transition: border-color 0.3s, background 0.3s; }
  .checkbox { width: 20px; height: 20px; border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-width: 1px; border-style: solid; transition: background 0.2s, border-color 0.2s; }
  .checkbox.on span { display: inline-block; animation: checkPop 0.3s ease-out; }
  .checklist-label { font-size: 14px; font-weight: 700; color: var(--text); }
  .checklist-hint { font-size: 12px; color: var(--dim); margin-top: 2px; }
  textarea.backup { width: 100%; height: 70px; background: #080B12; border: 1px solid var(--border); border-radius: 2px; color: #8FA3C4; font-size: 10px; padding: 8px; font-family: ui-monospace, monospace; margin-bottom: 10px; }
  .btn { border: none; border-radius: 2px; font-weight: 700; padding: 10px 18px; font-size: 12px; letter-spacing: 1px; cursor: pointer; font-family: inherit; }
  .btn-outline { background: transparent; border: 1px solid var(--orange); color: var(--orange); }
  .flex-row { display: flex; gap: 8px; }
  .grow { flex: 1; }
  .level-up-flash { position: fixed; top: 16%; left: 50%; transform: translateX(-50%); z-index: 50; text-align: center; pointer-events: none; }
  .level-up-inner { position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; flex-direction: column; animation: levelPop 0.5s cubic-bezier(.2,.9,.3,1); }
  .svg-chart text { font-size: 8px; fill: var(--dim); font-family: ui-monospace, monospace; }
  .error-banner { margin: 16px 18px; padding: 10px 14px; background: #1F0E12; border: 1px solid #5A2530; border-radius: 2px; font-size: 13px; color: #FF9F9F; }
  .msg-banner { margin: 0 0 10px; padding: 8px 12px; background: #0E1F16; border: 1px solid #2E5A3A; border-radius: 2px; font-size: 12px; color: var(--green); }
  p { line-height: 1.5; }
  b { color: var(--text); }
</style>
</head>
<body>
<canvas id="bgcanvas"></canvas>
<div id="bgwash"></div>
<div id="boot">
  <div id="bootLines"></div>
  <div class="boot-bar"><div class="boot-bar-fill"></div></div>
</div>
<div id="app"></div>
<script>
/* ============================================================
   DATA — restructured into A/B variants per hypertrophy research:
   - V-taper (lat width + lateral delt) is the primary aesthetic driver
   - Different angles/grips grow different regions of the same muscle
   - 10-20 sets/week/muscle is the evidence-backed hypertrophy range
   - Calves + abs are commonly neglected; both added with direct work
   ============================================================ */
var HUNTER_NAME = "Saksham";

var PLAN = {
  "Push A": [
    { name: "Barbell Bench Press", sets: 4, reps: "6-10", type: "bilateral" },
    { name: "Seated Dumbbell Shoulder Press", sets: 3, reps: "8-10", type: "bilateral" },
    { name: "Incline Dumbbell Press", sets: 3, reps: "10-12", type: "unilateral", note: "Left arm first" },
    { name: "Lateral Raises", sets: 3, reps: "12-15", type: "bilateral" },
    { name: "Single-Arm DB Shrug", sets: 3, reps: "12", type: "unilateral", note: "Right side first" },
    { name: "Rope Triceps Pushdown", sets: 3, reps: "10-12", type: "bilateral" }
  ],
  "Pull A": [
    { name: "Barbell Row (bent-over or chest-supported)", sets: 4, reps: "6-10", type: "bilateral" },
    { name: "Wide-Grip Pull-up / Lat Pulldown", sets: 4, reps: "8-12", type: "bilateral" },
    { name: "Single-Arm DB Row", sets: 3, reps: "10-12", type: "unilateral", note: "Left arm first" },
    { name: "Face Pulls", sets: 3, reps: "15", type: "bilateral" },
    { name: "Dumbbell Curl", sets: 3, reps: "10-12", type: "unilateral", note: "Left arm first" },
    { name: "Left-Arm Curl (bonus)", sets: 1, reps: "10-12", type: "left-only", note: "Catch-up volume" }
  ],
  "Legs A": [
    { name: "Squat", sets: 4, reps: "6-10", type: "bilateral" },
    { name: "Bulgarian Split Squat", sets: 3, reps: "10-12", type: "unilateral", note: "Left leg first" },
    { name: "Leg Press", sets: 3, reps: "10-12", type: "bilateral" },
    { name: "Leg Curl", sets: 3, reps: "12", type: "bilateral" },
    { name: "Standing Calf Raise", sets: 4, reps: "15", type: "bilateral" },
    { name: "Hanging Leg Raise", sets: 3, reps: "12-15", type: "bilateral" }
  ],
  "Push B": [
    { name: "Incline Barbell Press", sets: 4, reps: "6-10", type: "bilateral" },
    { name: "Cable Lateral Raise", sets: 3, reps: "12-15", type: "bilateral" },
    { name: "Flat Dumbbell Press", sets: 3, reps: "10-12", type: "unilateral", note: "Left arm first" },
    { name: "Overhead Cable Triceps Extension", sets: 3, reps: "10-12", type: "bilateral" },
    { name: "Single-Arm DB Shrug", sets: 3, reps: "12", type: "unilateral", note: "Right side first" },
    { name: "Dips", sets: 3, reps: "8-12", type: "bilateral" }
  ],
  "Pull B": [
    { name: "Neutral-Grip Pull-up / Close-Grip Lat Pulldown", sets: 4, reps: "8-12", type: "bilateral" },
    { name: "Seated Cable Row", sets: 3, reps: "10-12", type: "bilateral" },
    { name: "Single-Arm Cable Pulldown", sets: 3, reps: "10-12", type: "unilateral", note: "Left arm first" },
    { name: "Machine Reverse Fly", sets: 3, reps: "15", type: "bilateral" },
    { name: "Incline Dumbbell Curl", sets: 3, reps: "10-12", type: "unilateral", note: "Left arm first" },
    { name: "Left-Arm Curl (bonus)", sets: 1, reps: "10-12", type: "left-only", note: "Catch-up volume" }
  ],
  "Legs B": [
    { name: "Leg Press", sets: 4, reps: "8-12", type: "bilateral" },
    { name: "Walking Step-Up", sets: 3, reps: "10-12", type: "unilateral", note: "Left leg first" },
    { name: "45° Back Extension", sets: 3, reps: "10-12", type: "bilateral" },
    { name: "Leg Extension", sets: 3, reps: "12-15", type: "bilateral" },
    { name: "Seated Calf Raise", sets: 4, reps: "15", type: "bilateral" },
    { name: "Cable Crunch", sets: 3, reps: "12-15", type: "bilateral" }
  ],
  Rest: []
};

var WEEK_MAP = ["Rest", "Push A", "Pull A", "Legs A", "Push B", "Pull B", "Legs B"];
var DAY_BASE_CATEGORY = { "Push A": "Push", "Push B": "Push", "Pull A": "Pull", "Pull B": "Pull", "Legs A": "Legs", "Legs B": "Legs", "Rest": "Rest" };
var RANKS = [
  { min: 0, label: "E", color: "#6B7A91" },
  { min: 5, label: "D", color: "#4ADE80" },
  { min: 10, label: "C", color: "#2ED3FF" },
  { min: 15, label: "B", color: "#8B6FFF" },
  { min: 20, label: "A", color: "#FF9F5A" },
  { min: 25, label: "S", color: "#FFD166" }
];

var INCREMENTS = {
  "Barbell Bench Press": 2.5, "Seated Dumbbell Shoulder Press": 2, "Incline Dumbbell Press": 2,
  "Lateral Raises": 1, "Single-Arm DB Shrug": 2, "Rope Triceps Pushdown": 2.5,
  "Barbell Row (bent-over or chest-supported)": 2.5, "Wide-Grip Pull-up / Lat Pulldown": 2.5,
  "Single-Arm DB Row": 2, "Face Pulls": 2.5, "Dumbbell Curl": 1, "Left-Arm Curl (bonus)": 1,
  "Squat": 5, "Bulgarian Split Squat": 2, "Leg Press": 10, "Leg Curl": 2.5,
  "Standing Calf Raise": 5, "Hanging Leg Raise": 2.5, "Incline Barbell Press": 2.5,
  "Cable Lateral Raise": 1, "Flat Dumbbell Press": 2, "Overhead Cable Triceps Extension": 2,
  "Dips": 2.5, "Neutral-Grip Pull-up / Close-Grip Lat Pulldown": 2.5, "Seated Cable Row": 2.5,
  "Single-Arm Cable Pulldown": 2, "Machine Reverse Fly": 2, "Incline Dumbbell Curl": 1,
  "Leg Press": 10, "Walking Step-Up": 2, "45° Back Extension": 2.5, "Leg Extension": 2.5,
  "Seated Calf Raise": 5, "Cable Crunch": 2.5
};

var EXERCISE_CATEGORY = {};
Object.keys(PLAN).forEach(function (cat) {
  if (cat === "Rest") return;
  PLAN[cat].forEach(function (ex) { EXERCISE_CATEGORY[ex.name] = DAY_BASE_CATEGORY[cat]; });
});

/* ============================================================
   DATE HELPERS
   ============================================================ */
function todayKey(offset) {
  offset = offset || 0;
  var d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}
function dayTypeFor(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  return WEEK_MAP[d.getDay()];
}
function fmtDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "short" });
}
function getWeekStart(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  var day = d.getDay();
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0, 10);
}

/* ============================================================
   PROGRESSION INTELLIGENCE
   ============================================================ */
function parseRepRange(str) {
  var m = String(str).match(/(\d+)(?:-(\d+))?/);
  if (!m) return { min: 8, max: 12 };
  var min = parseInt(m[1], 10);
  var max = m[2] ? parseInt(m[2], 10) : min;
  return { min: min, max: max };
}
function extractPairs(sets, sideKey) {
  var out = [];
  (sets || []).forEach(function (s) {
    if (!s) return;
    if (sideKey) {
      var side = s[sideKey];
      if (side && side.w !== "" && side.r !== "" && side.w != null && side.r != null) {
        out.push({ w: Number(side.w), r: Number(side.r) });
      }
    } else if (s.w !== "" && s.r !== "" && s.w != null && s.r != null) {
      out.push({ w: Number(s.w), r: Number(s.r) });
    }
  });
  return out;
}
function roundStep(v) { return Math.round(v * 2) / 2; }
function evaluateSets(pairs, range, increment) {
  var lastWeight = pairs[pairs.length - 1].w;
  var minReps = Math.min.apply(null, pairs.map(function (p) { return p.r; }));
  if (minReps >= range.max) {
    return { status: "increase-weight", weight: roundStep(lastWeight + increment), reps: range.min, lastWeight: lastWeight, lastReps: minReps };
  }
  if (minReps >= range.min) {
    return { status: "increase-reps", weight: lastWeight, reps: Math.min(minReps + 1, range.max), lastWeight: lastWeight, lastReps: minReps };
  }
  return { status: "hold", weight: lastWeight, reps: range.min, lastWeight: lastWeight, lastReps: minReps };
}
function checkPlateau(history, sideKey) {
  var lastN = history.slice(-3);
  if (lastN.length < 3) return false;
  var stats = lastN.map(function (h) {
    var pairs = extractPairs(h.sets, sideKey);
    if (!pairs.length) return null;
    return { weight: pairs[pairs.length - 1].w, minReps: Math.min.apply(null, pairs.map(function (p) { return p.r; })) };
  });
  if (stats.some(function (s) { return !s; })) return false;
  var sameWeight = stats.every(function (s) { return s.weight === stats[0].weight; });
  var repsNotImproving = stats[2].minReps <= stats[0].minReps;
  return sameWeight && repsNotImproving;
}
function evaluateSideHistory(history, sideKey, range, increment) {
  if (!history.length) return { status: "no-data" };
  var last = history[history.length - 1];
  var pairs = extractPairs(last.sets, sideKey);
  if (!pairs.length) return { status: "no-data" };
  var ev = evaluateSets(pairs, range, increment);
  ev.plateau = checkPlateau(history, sideKey);
  return ev;
}
function buildSuggestion(ex, combinedLogs, excludeDate) {
  var history = [];
  Object.keys(combinedLogs).forEach(function (d) {
    if (d === excludeDate) return;
    var exs = combinedLogs[d];
    if (exs && exs[ex.name] && exs[ex.name].length) history.push({ date: d, sets: exs[ex.name] });
  });
  history.sort(function (a, b) { return a.date.localeCompare(b.date); });
  var range = parseRepRange(ex.reps);
  var increment = INCREMENTS[ex.name] || 2.5;
  if (ex.type === "bilateral") return { type: "bilateral", main: evaluateSideHistory(history, null, range, increment) };
  if (ex.type === "left-only") return { type: "left-only", L: evaluateSideHistory(history, "L", range, increment) };
  return { type: "unilateral", L: evaluateSideHistory(history, "L", range, increment), R: evaluateSideHistory(history, "R", range, increment) };
}
function computeWeeklyVolume(combinedLogs) {
  var weeks = {};
  Object.keys(combinedLogs).forEach(function (d) {
    var exs = combinedLogs[d];
    if (!exs) return;
    var ws = getWeekStart(d);
    Object.keys(exs).forEach(function (exName) {
      var cat = EXERCISE_CATEGORY[exName];
      if (!cat) return;
      var vol = 0;
      (exs[exName] || []).forEach(function (s) {
        if (!s) return;
        if (s.w && s.r) vol += Number(s.w) * Number(s.r);
        if (s.L && s.L.w && s.L.r) vol += Number(s.L.w) * Number(s.L.r);
        if (s.R && s.R.w && s.R.r) vol += Number(s.R.w) * Number(s.R.r);
      });
      if (!weeks[ws]) weeks[ws] = { week: ws, Push: 0, Pull: 0, Legs: 0 };
      weeks[ws][cat] += vol;
    });
  });
  var arr = Object.keys(weeks).map(function (k) { return weeks[k]; });
  arr.sort(function (a, b) { return a.week.localeCompare(b.week); });
  return arr.slice(-4);
}
function computeBalance(weeklyData) {
  if (!weeklyData.length) return { flag: false };
  var last = weeklyData[weeklyData.length - 1];
  var vals = [last.Push, last.Pull, last.Legs];
  var max = Math.max.apply(null, vals);
  var min = Math.min.apply(null, vals);
  if (max === 0) return { flag: false };
  if (min < max * 0.6) {
    var cats = ["Push", "Pull", "Legs"];
    var minCat = cats[vals.indexOf(min)];
    return { flag: true, text: minCat + " volume is noticeably behind the others this week — an illustrative pattern from your logs, not a diagnosis. Consider prioritizing " + minCat.toLowerCase() + " a little harder in your next session." };
  }
  return { flag: false };
}

}

function handleBilateral(exName, idx, field, value) {
  var sets = (S.todayLog[exName] || []).slice();
  while (sets.length <= idx) sets.push({ w: "", r: "" });
  sets[idx] = Object.assign({}, sets[idx]);

  S.todayLog[exName] = sets;
  persistWorkout();
  render();
}
function handleUnilateral(exName, idx, side, field, value) {
  var sets = (S.todayLog[exName] || []).slice();
  while (sets.length <= idx) sets.push({ L: { w: "", r: "" }, R: { w: "", r: "" } });
  var set = Object.assign({}, sets[idx]);
  set[side] = Object.assign({}, set[side] || { w: "", r: "" });
  set[side][field] = value;
  sets[idx] = set;
  S.todayLog = Object.assign({}, S.todayLog);
  S.todayLog[exName] = sets;

  var filtered = S.bwHistory.filter(function (e) { return e.date !== S.date; });
  filtered.push({ date: S.date, weight: val });

/* ============================================================
   DERIVED STATE
   ============================================================ */
function computeDerived() {
  var combinedLogs = Object.assign({}, S.allLogs);
  combinedLogs[S.date] = S.todayLog;

  var xp = 0, vol = 0;
  var sessions = {};
  Object.keys(combinedLogs).forEach(function (d) {
    var exs = combinedLogs[d] || {};
    Object.keys(exs).forEach(function (exName) {
      (exs[exName] || []).forEach(function (s) {
        if (s && s.w && s.r) { xp += 10; vol += Number(s.w) * Number(s.r); sessions[d] = true; }
        if (s && s.L && s.L.w && s.L.r) { xp += 10; vol += Number(s.L.w) * Number(s.L.r); sessions[d] = true; }
        if (s && s.R && s.R.w && s.R.r) { xp += 10; vol += Number(s.R.w) * Number(s.R.r); sessions[d] = true; }
      });
    });
  });

  var suggestions = {};
  Object.keys(PLAN).forEach(function (cat) {
    PLAN[cat].forEach(function (ex) { suggestions[ex.name] = buildSuggestion(ex, combinedLogs, S.date); });
  });

  var weeklyVolume = computeWeeklyVolume(combinedLogs);
  var balance = computeBalance(weeklyVolume);

  var level = Math.floor(xp / 100) + 1;
  var xpIntoLevel = xp % 100;
  var rank = RANKS.slice().reverse().find(function (r) { return level >= r.min; }) || RANKS[0];

  var streak = 0;
  for (var i = 0; i < 60; i++) {
    var dt = todayKey(-i);
    var dType = dayTypeFor(dt);
    if (dType === "Rest") continue;
    if (sessions[dt]) streak++;
    else if (i === 0) continue;
    else break;
  }

  var sessionCount = Object.keys(sessions).length;
  var STR = Math.min(100, Math.round(vol / 250));
  var VIT = Math.min(100, Math.round(streak * 8));
  var END = Math.min(100, Math.round(sessionCount * 4));

  var latestBw = S.bwHistory.length ? S.bwHistory[S.bwHistory.length - 1].weight : null;
  var startBw = S.bwHistory.length ? S.bwHistory[0].weight : null;
  var bwGain = latestBw && startBw ? latestBw - startBw : 0;
  var PHY = Math.min(100, Math.max(0, Math.round(bwGain * 18)));

  var dayType = dayTypeFor(S.date);
  var plan = PLAN[dayType] || [];
  var done = 0, total = 0;
  plan.forEach(function (ex) {
    var sets = S.todayLog[ex.name] || [];
    if (ex.type === "bilateral") {
      total += ex.sets;
      for (var i2 = 0; i2 < ex.sets; i2++) if (sets[i2] && sets[i2].w && sets[i2].r) done++;
    } else if (ex.type === "unilateral") {
      total += ex.sets * 2;
      for (var i3 = 0; i3 < ex.sets; i3++) {
        var s3 = sets[i3];
        if (s3 && s3.L && s3.L.w && s3.L.r) done++;
        if (s3 && s3.R && s3.R.w && s3.R.r) done++;
      }
    } else if (ex.type === "left-only") {
      total += ex.sets;
      for (var i4 = 0; i4 < ex.sets; i4++) if (sets[i4] && sets[i4].L && sets[i4].L.w && sets[i4].L.r) done++;
    }
  });

  return {
    combinedLogs: combinedLogs, totalXP: xp, totalVolume: vol, sessionCount: sessionCount,
    suggestions: suggestions, weeklyVolume: weeklyVolume, balance: balance,
    level: level, xpIntoLevel: xpIntoLevel, rank: rank, streak: streak,
    STR: STR, VIT: VIT, END: END, PHY: PHY,
    dayType: dayType, plan: plan, todayCompletion: { done: done, total: total },
    questComplete: total > 0 && done === total,
    latestBw: latestBw, startBw: startBw, bwGain: bwGain
  };
}

/* ============================================================

function esc(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function statusColor(status) {
  if (status === "increase-weight") return "#4ADE80";
  if (status === "increase-reps") return "#2ED3FF";
  if (status === "hold") return "#FFD166";
  return "#5E7291";
}
function statusText(s) {
  if (s.status === "no-data") return "No history yet — log today as your baseline";
  if (s.status === "increase-weight") return "\u2191 Weight \u2192 " + s.weight + "kg \u00d7 " + s.reps + " reps (hit " + s.lastReps + " reps @ " + s.lastWeight + "kg last time)";
  if (s.status === "increase-reps") return "\u2191 Reps \u2192 aim " + s.reps + " reps @ " + s.weight + "kg (hit " + s.lastReps + " last time)";
  if (s.status === "hold") return "Hold \u2192 repeat " + s.weight + "kg, aim " + s.reps + "+ reps (missed target range last time)";
  return "";
}
function suggestionLineHtml(label, s) {
  if (!s) return "";
  var html = '<div class="suggest-line-wrap">';
  html += '<div class="suggest-line" style="color:' + statusColor(s.status) + '">';
  if (label) html += '<span class="mono" style="margin-right:6px;">' + label + '</span>';
  html += statusText(s) + "</div>";
  if (s.plateau) html += '<div class="plateau-line">\u26A0 Plateaued — same weight & reps for 3 sessions straight. Consider a light deload (~10% less weight) or swapping the exercise for a week or two.</div>';
  html += "</div>";
  return html;
}
function exerciseSuggestionHtml(suggestion) {
  if (!suggestion) return "";
  if (suggestion.type === "bilateral") return suggestionLineHtml(null, suggestion.main);
  if (suggestion.type === "left-only") return suggestionLineHtml("L", suggestion.L);
  var rank = { "no-data": 0, "hold": 1, "increase-reps": 2, "increase-weight": 3 };
  var rL = rank[suggestion.L.status] || 0;
  var rR = rank[suggestion.R.status] || 0;
  var asymmetry = suggestion.L.status !== "no-data" && suggestion.R.status !== "no-data" && rL !== rR;
  var weaker = rL < rR ? "left" : "right";
  var html = suggestionLineHtml("L", suggestion.L) + suggestionLineHtml("R", suggestion.R);
  if (asymmetry) html += '<div class="asym-line">Pace by the ' + weaker + ' side — hold both there until it catches up, then progress together.</div>';
  return html;
}
function nextDelay() { S.cardCounter += 1; return Math.min(S.cardCounter * 45, 420); }
function hexToRgba(hex, alpha) {
  hex = String(hex).replace("#", "");
  if (hex.length === 3) hex = hex.split("").map(function (c) { return c + c; }).join("");
  var r = parseInt(hex.substring(0, 2), 16), g = parseInt(hex.substring(2, 4), 16), b = parseInt(hex.substring(4, 6), 16);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}
function winOpen(accent, extraStyle) {

/* ---- simple SVG charts, no external libs ---- */
function lineChartSvg(history) {
  if (history.length < 2) return '<p style="color:var(--dim);font-size:13px;text-align:center;padding:24px 0;">Log at least 2 entries to reveal your growth curve.</p>';
  var w = 300, h = 160, pad = 28;
  var weights = history.map(function (e) { return e.weight; });
  var minW = Math.min.apply(null, weights) - 1;
  var maxW = Math.max.apply(null, weights) + 1;
  var n = history.length;
  function x(i) { return pad + (i / (n - 1)) * (w - pad * 1.5); }
  function y(val) { return h - pad - ((val - minW) / (maxW - minW || 1)) * (h - pad * 1.8); }
  var points = history.map(function (e, i) { return x(i) + "," + y(e.weight); }).join(" ");
  var dots = history.map(function (e, i) { return '<circle cx="' + x(i) + '" cy="' + y(e.weight) + '" r="3" fill="#2ED3FF" />'; }).join("");
  var gridLines = "";
  for (var g = 0; g <= 3; g++) {
    var gy = pad + (g / 3) * (h - pad * 1.8);
    gridLines += '<line x1="' + pad + '" y1="' + gy + '" x2="' + (w - pad * 0.5) + '" y2="' + gy + '" stroke="#1B2A45" stroke-dasharray="2,3" />';
  }
  var firstLabel = history[0].date.slice(5);
  var lastLabel = history[n - 1].date.slice(5);
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="svg-chart" style="width:100%;height:180px;">' + gridLines +
    '<polyline points="' + points + '" fill="none" stroke="#2ED3FF" stroke-width="2" />' + dots +
    '<text x="' + pad + '" y="' + (h - 4) + '">' + firstLabel + '</text>' +
    '<text x="' + (w - pad * 2) + '" y="' + (h - 4) + '">' + lastLabel + '</text>' +
    '<text x="2" y="' + (pad + 4) + '">' + Math.round(maxW) + '</text>' +
    '<text x="2" y="' + (h - pad + 4) + '">' + Math.round(minW) + '</text>' + "</svg>";
}
function barChartSvg(weeklyVolume) {
  if (!weeklyVolume.length) return '<p style="color:var(--dim);font-size:13px;text-align:center;padding:20px 0;">Log a few sessions to see your split balance here.</p>';
  var w = 300, h = 170, pad = 24;
  var maxVal = Math.max.apply(null, weeklyVolume.map(function (wk) { return Math.max(wk.Push, wk.Pull, wk.Legs); })) || 1;
  var groupW = (w - pad * 1.5) / weeklyVolume.length;
  var barW = groupW / 4.2;
  var colors = { Push: "#2ED3FF", Pull: "#8B6FFF", Legs: "#FFD166" };
  var bars = "", labels = "";
  weeklyVolume.forEach(function (wk, gi) {
    var gx = pad + gi * groupW;
    ["Push", "Pull", "Legs"].forEach(function (cat, ci) {
      var val = wk[cat];
      var barH = (val / maxVal) * (h - pad * 2.2);
      var bx = gx + ci * (barW + 3);
      var by = h - pad - barH;
      bars += '<rect x="' + bx + '" y="' + by + '" width="' + barW + '" height="' + barH + '" fill="' + colors[cat] + '" rx="1" />';
    });
    labels += '<text x="' + (gx + groupW / 2 - 10) + '" y="' + (h - 6) + '">' + wk.week.slice(5) + '</text>';
  });
  var legend = '<circle cx="' + pad + '" cy="8" r="3" fill="#2ED3FF" /><text x="' + (pad + 7) + '" y="11">Push</text>' +
    '<circle cx="' + (pad + 45) + '" cy="8" r="3" fill="#8B6FFF" /><text x="' + (pad + 52) + '" y="11">Pull</text>' +
    '<circle cx="' + (pad + 88) + '" cy="8" r="3" fill="#FFD166" /><text x="' + (pad + 95) + '" y="11">Legs</text>';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="svg-chart" style="width:100%;height:190px;">' + legend + bars + labels + "</svg>";
}

    html0 += '<div class="sys" style="font-size:18px;margin-bottom:8px;">NO DUNGEON TODAY</div>';
    html0 += '<p style="font-size:14px;color:#B8C7DE;">Rest days are still part of the quest. Sleep 7-8 hours and hit your calorie target — check them off under the <b>RECOVER</b> tab. This is when the System actually builds new stats.</p>';
    html0 += winClose();
    return html0;
  }
  var accent = d.questComplete ? "#4ADE80" : "#2ED3FF";
  var html = winOpen(accent);
  html += '<div class="quest-header"><div>' + sectionLabel(d.questComplete ? "QUEST COMPLETE" : "DAILY QUEST", accent) +
    '<div class="sys" style="font-size:16px;">' + baseCat.toUpperCase() + ' DAY<span class="day-badge">VARIANT ' + variant + '</span></div></div>';
  html += '<div class="quest-count mono" style="color:' + accent + '">' + d.todayCompletion.done + "/" + d.todayCompletion.total + "</div></div>";
  html += winClose();

  d.plan.forEach(function (ex) { html += exerciseCardHtml(ex, S.todayLog[ex.name] || [], d.suggestions[ex.name]); });
  return html;
}

function exerciseCardHtml(ex, sets, suggestion) {
  var delay = nextDelay();
  var html = '<div class="ex-card card-in" style="animation-delay:' + delay + 'ms;">';
  html += '<div class="ex-head"><h3 class="ex-name">' + esc(ex.name) + '</h3><span class="ex-target mono">' + ex.sets + '\u00d7' + ex.reps + '</span></div>';
  if (ex.note) html += '<div class="ex-note">' + esc(ex.note.toUpperCase()) + '</div>';
  if (suggestion) html += '<div class="suggest-box"><div class="suggest-label">SYSTEM SUGGESTS</div>' + exerciseSuggestionHtml(suggestion) + '</div>';
  var safeName = esc(ex.name).replace(/'/g, "\\'");

  if (ex.type === "bilateral") {
    for (var i = 0; i < ex.sets; i++) {
      var s = sets[i] || { w: "", r: "" };
      html += '<div class="set-row"><span class="set-idx mono">' + (i + 1) + '</span>' +
        '<input class="numfield mono" type="number" inputmode="decimal" placeholder="kg" value="' + esc(s.w) + '" onchange="handleBilateral(\'' + safeName + '\',' + i + ',\'w\',this.value)" />' +
        '<span class="set-x">\u00d7</span>' +
        '<input class="numfield mono" type="number" inputmode="numeric" placeholder="reps" value="' + esc(s.r) + '" onchange="handleBilateral(\'' + safeName + '\',' + i + ',\'r\',this.value)" /></div>';
    }
  } else if (ex.type === "unilateral") {
    for (var j = 0; j < ex.sets; j++) {
      var sj = sets[j] || { L: { w: "", r: "" }, R: { w: "", r: "" } };
      html += '<div class="side-block"><div class="set-idx-label mono">SET ' + (j + 1) + '</div>';
      ["L", "R"].forEach(function (side) {
        var sideVal = sj[side] || { w: "", r: "" };
        var color = side === "L" ? "#2ED3FF" : "#8B6FFF";
        html += '<div class="set-row"><span class="set-idx mono" style="color:' + color + '">' + side + '</span>' +
          '<input class="numfield mono" type="number" inputmode="decimal" placeholder="kg" value="' + esc(sideVal.w) + '" onchange="handleUnilateral(\'' + safeName + '\',' + j + ',\'' + side + '\',\'w\',this.value)" />' +
          '<span class="set-x">\u00d7</span>' +
          '<input class="numfield mono" type="number" inputmode="numeric" placeholder="reps" value="' + esc(sideVal.r) + '" onchange="handleUnilateral(\'' + safeName + '\',' + j + ',\'' + side + '\',\'r\',this.value)" /></div>';
      });
      html += "</div>";
    }
  } else if (ex.type === "left-only") {
    for (var k = 0; k < ex.sets; k++) {
      var sk = sets[k] || { L: { w: "", r: "" } };
      var lv = sk.L || { w: "", r: "" };
      html += '<div class="set-row"><span class="set-idx mono" style="color:#2ED3FF">L</span>' +
        '<input class="numfield mono" type="number" inputmode="decimal" placeholder="kg" value="' + esc(lv.w) + '" onchange="handleUnilateral(\'' + safeName + '\',' + k + ',\'L\',\'w\',this.value)" />' +
        '<span class="set-x">\u00d7</span>' +
        '<input class="numfield mono" type="number" inputmode="numeric" placeholder="reps" value="' + esc(lv.r) + '" onchange="handleUnilateral(\'' + safeName + '\',' + k + ',\'L\',\'r\',this.value)" /></div>';
    }
  }
  html += "</div>";
  return html;
}

function renderIntel(d) {
  var html = winOpen("#8B6FFF");
  html += sectionLabel("WEEKLY VOLUME BY SPLIT", "#8B6FFF");
  html += barChartSvg(d.weeklyVolume);
  html += winClose();

  if (d.balance.flag) {
    html += winOpen("#FF9F5A");
    html += sectionLabel("BALANCE FLAG", "#FF9F5A");
    html += '<p style="font-size:13px;color:var(--text);margin:0;">' + esc(d.balance.text) + '</p>';
    html += winClose();
  }

  ["Push", "Pull", "Legs"].forEach(function (cat) {
    var color = cat === "Push" ? "#2ED3FF" : cat === "Pull" ? "#8B6FFF" : "#FFD166";
    html += sectionLabel(cat.toUpperCase() + " — PROGRESSION", color);
    [cat + " A", cat + " B"].forEach(function (dayKey) {
      html += '<div style="font-size:10px;color:var(--dim);letter-spacing:1px;margin:4px 0 6px;">' + dayKey.toUpperCase() + '</div>';
      PLAN[dayKey].forEach(function (ex) {
        html += winOpen("#1B2A45", "padding:12px 14px;");
        html += '<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:14px;font-weight:700;">' + esc(ex.name) + '</span><span class="mono" style="font-size:10px;color:var(--dim);">' + ex.reps + ' target</span></div>';
        html += exerciseSuggestionHtml(d.suggestions[ex.name]);
        html += winClose();
      });
    });
  });

  html += '<p style="font-size:11px;color:var(--dim);margin-top:4px;">Suggestions use double-progression logic on your last logged session for each exercise: hit the top of the rep range on every set \u2192 add weight; land inside the range \u2192 add a rep; miss the bottom of the range \u2192 hold and repeat. It\'s a starting recommendation, not a command.</p>';
  return html;
}

function renderGrowth(d) {
  var html = winOpen("#FFD166");
  html += sectionLabel("MASS TRACKING", "#FFD166");
  html += '<div class="flex-row"><input class="numfield mono grow" style="text-align:left;" type="number" inputmode="decimal" placeholder="Today\'s weight (kg)" value="' + esc(S.bwInput) + '" oninput="handleBWInput(this.value)" />';
  html += '<button class="btn" style="background:#FFD166;color:#05070C;" onclick="saveBW()">LOG</button></div>';
  html += winClose();

  if (S.bwHistory.length > 0) {
    html += '<div class="mini-grid">' + miniStat("LATEST", d.latestBw + "kg", "#DCEFFF") +
      miniStat("GAINED", (d.bwGain > 0 ? "+" : "") + d.bwGain.toFixed(1) + "kg", d.bwGain >= 0 ? "#4ADE80" : "#FF9F9F") +
      miniStat("ENTRIES", S.bwHistory.length, "#8FA3C4") + "</div>";
  }

  html += winOpen("#2ED3FF");
  html += sectionLabel("GROWTH CURVE", "#2ED3FF");
  html += lineChartSvg(S.bwHistory);
  html += winClose();

  html += '<p style="font-size:12px;color:var(--dim);margin-top:14px;">Target: ~0.5–1kg gain per month. Flat for 2-3 weeks straight means your surplus isn\'t big enough — raise calories, not just training volume.</p>';
  return html;
}

function renderRecovery(d) {
  var today = S.nutrition[S.date] || {};
  var items = [
    { key: "protein", label: "Protein target hit (130–150g)", hint: "eggs, paneer, chicken, dal, curd, whey" },
    { key: "surplus", label: "Ate in a calorie surplus", hint: "4-5 meals across the day" },
    { key: "sleep", label: "Slept 7-8 hours", hint: "recovery window — non-negotiable" }
  ];
  var allDone = items.every(function (it) { return today[it.key]; });
  var accent = allDone ? "#4ADE80" : "#8B6FFF";
  var html = winOpen(accent);
  html += sectionLabel(allDone ? "RECOVERY COMPLETE" : "RECOVERY CHECKLIST", accent);
  html += '<p style="font-size:13px;color:#B8C7DE;margin:0;">This is where STR and PHYSIQUE stats actually get built — training only creates the demand.</p>';
  html += winClose();

  items.forEach(function (it) {
    var on = !!today[it.key];
    html += '<button class="checklist-item" style="border-color:' + (on ? "#4ADE80" : "var(--border)") + '" onclick="toggleNutrition(\'' + it.key + '\')">';
    html += '<div class="checkbox ' + (on ? "on" : "") + '" style="background:' + (on ? "#4ADE80" : "transparent") + ';border-color:' + (on ? "#4ADE80" : "#3A4A6A") + '">' + (on ? '<span style="color:#05070C;font-size:13px;font-weight:700;">\u2713</span>' : "") + '</div>';
    html += '<div><div class="checklist-label">' + esc(it.label) + '</div><div class="checklist-hint">' + esc(it.hint) + '</div></div></button>';
  });
  return html;
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render() {
  S.cardCounter = 0;
  var d = computeDerived();

  if (S.prevLevel !== null && d.level > S.prevLevel) {
    S.levelUpFlash = true;
    setTimeout(function () { S.levelUpFlash = false; render(); }, 2200);
  }
  S.prevLevel = d.level;

  var tabs = ["Status", "Quests", "Intel", "Growth", "Recovery"];
  var tabLabels = { Status: "STATUS", Quests: "QUEST", Intel: "INTEL", Growth: "GROWTH", Recovery: "RECOVER" };

  var html = "";
  if (S.levelUpFlash) {
    html += '<div class="level-up-flash"><div class="level-up-inner"><div class="level-ring"></div><div class="level-ring" style="animation-delay:0.4s;"></div>' +
      '<div class="sys" style="font-size:11px;letter-spacing:4px;color:#2ED3FF;position:relative;">LEVEL UP</div>' +
      '<div class="sys" style="font-size:40px;color:#DCEFFF;text-shadow:0 0 30px #2ED3FF;position:relative;">' + d.level + "</div></div></div>";
  }

  html += '<div class="header"><div class="header-row"><div><div class="header-sub">THE SYSTEM</div><h1 class="header-title">HUNTER: ' + HUNTER_NAME.toUpperCase() + '</h1></div>';
  html += '<div class="rank-badge"><div class="rank-letter" style="color:' + d.rank.color + ';text-shadow:0 0 14px ' + d.rank.color + '88;">' + d.rank.label + '</div><div class="rank-label">RANK</div></div></div>';
  html += '<div class="header-date">' + fmtDate(S.date) + "</div></div>";

  html += '<nav class="nav">';
  tabs.forEach(function (t) { html += '<button class="' + (S.tab === t ? "active" : "") + '" onclick="setTab(\'' + t + '\')">' + tabLabels[t] + "</button>"; });
  html += "</nav>";

  if (!S.storageOk) html += '<div class="error-banner">Could not save to this device\'s storage. Your entries still work this session — use Data Backup on the Status tab before closing.</div>';

  html += '<main class="main main-fade">';
  if (S.tab === "Status") html += renderStatus(d);
  else if (S.tab === "Quests") html += renderQuests(d);
  else if (S.tab === "Intel") html += renderIntel(d);
  else if (S.tab === "Growth") html += renderGrowth(d);
  else html += renderRecovery(d);
  html += "</main>";

  document.getElementById("app").innerHTML = html;
  revealCards();
}

function revealCards() {
  var cards = document.querySelectorAll(".card-in:not(.show)");
  // Double rAF so the browser paints the initial (hidden) state before we flip it,
  // which is what actually makes the transition play.
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      cards.forEach(function (c) { c.classList.add("show"); });
    });
  });
  // Safety net: whatever happens with the transition above, force full visibility
  // shortly after so nothing can ever get permanently stuck invisible again.
  setTimeout(function () {
    document.querySelectorAll(".card-in").forEach(function (c) {
      c.style.opacity = "1";
      c.style.transform = "none";
    });
  }, 700);
}

/* ============================================================
   BACKGROUND PARTICLE NETWORK (canvas, lightweight, offline)
   ============================================================ */
(function initBg() {
  var canvas = document.getElementById("bgcanvas");
  var ctx = canvas.getContext("2d");
  var W, H, particles = [];
  var COUNT = 26;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener("resize", resize);
  resize();
  for (var i = 0; i < COUNT; i++) {
    particles.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25 });
  }
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    for (var i2 = 0; i2 < particles.length; i2++) {
      for (var j2 = i2 + 1; j2 < particles.length; j2++) {
        var a = particles[i2], b = particles[j2];
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 140) {
          ctx.strokeStyle = "rgba(46,211,255," + (0.12 * (1 - dist / 140)) + ")";
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      ctx.fillStyle = "rgba(139,111,255,0.5)";
      ctx.beginPath(); ctx.arc(particles[i2].x, particles[i2].y, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ============================================================
   BOOT SEQUENCE
   ============================================================ */
(function boot() {
  var lines = [
    "[SYSTEM] Initializing Hunter Interface...",
    "[SYSTEM] Loading Hunter: " + HUNTER_NAME.toUpperCase() + "...",
    "[SYSTEM] Reading training archive...",
    "[SYSTEM] Status Window ready."
  ];
  var container = document.getElementById("bootLines");
  lines.forEach(function (line, i) {
    var el = document.createElement("div");
    el.className = "boot-line";
    el.style.animationDelay = (i * 0.35) + "s";
    el.textContent = line;
    container.appendChild(el);
  });

  function finishBoot() {
    var boot = document.getElementById("boot");
    if (boot) boot.classList.add("hidden");
  }

  try {
    render();
  } catch (err) {
    var app = document.getElementById("app");
    if (app) app.innerHTML = '<div class="error-banner"><b>HUNTER could not finish loading.</b><br><span style="font-size:11px;opacity:.8;">' + esc(err && err.message ? err.message : String(err)) + '</span></div>';
  }

  // Never let a rendering/storage problem trap the user behind the boot screen.
  setTimeout(finishBoot, 1900);
  setTimeout(finishBoot, 3500);
})();
</script>
