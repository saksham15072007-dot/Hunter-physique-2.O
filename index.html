<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>HUNTER: SYSTEM</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #05070C; }
  body {
    color: #DCEFFF;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .sys-font { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .body-font { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .num { font-family: "SF Mono", "Consolas", "JetBrains Mono", monospace; }
  input:focus, button:focus, textarea:focus { outline: 2px solid #2ED3FF; outline-offset: 1px; }
  input[type=number]::-webkit-inner-spin-button { opacity: 0.3; }
  button { font-family: inherit; }
  @keyframes popIn {
    0% { transform: scale(0.9); opacity: 0; }
    60% { transform: scale(1.02); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .glow-text { text-shadow: 0 0 12px rgba(46,211,255,0.5); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #1B2A45; border-radius: 3px; }

  .sys-window { position: relative; background: linear-gradient(180deg, #0C1220 0%, #0A0F1A 100%); border-radius: 2px; padding: 18px; box-shadow: 0 0 0 1px rgba(0,0,0,0.4); }
  .sys-corner { position: absolute; width: 12px; height: 12px; }
  .input-cell { width: 100%; background: #080B12; border: 1px solid #1B2A45; border-radius: 2px; color: #DCEFFF; padding: 7px 8px; font-size: 13px; text-align: center; }
  .tab-btn { flex: 1; padding: 13px 0; background: transparent; border: none; font-size: 9.5px; letter-spacing: 1px; font-weight: 700; cursor: pointer; }
  .mini-stat { background: #0C1220; border-radius: 2px; padding: 12px 8px; text-align: center; }
  .checklist-btn { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: #0C1220; border-radius: 2px; padding: 14px; margin-bottom: 10px; cursor: pointer; }

  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:-1; background:radial-gradient(circle at 20% 10%, rgba(46,211,255,.09), transparent 28%), radial-gradient(circle at 85% 30%, rgba(139,111,255,.08), transparent 30%); }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:-1; opacity:.18; background-image:linear-gradient(rgba(46,211,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(46,211,255,.06) 1px,transparent 1px); background-size:34px 34px; mask-image:linear-gradient(to bottom,black,transparent 80%); }
  @keyframes scan { 0%{transform:translateY(-100%);opacity:0} 15%{opacity:.7} 80%{opacity:.15} 100%{transform:translateY(100vh);opacity:0} }
  @keyframes pulseGlow { 0%,100%{box-shadow:0 0 0 rgba(46,211,255,0)} 50%{box-shadow:0 0 24px rgba(46,211,255,.12)} }
  @keyframes floatIn { from{transform:translateY(8px);opacity:0} to{transform:translateY(0);opacity:1} }
  .hunter-scan { position:fixed; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg,transparent,#2ED3FF,transparent); animation:scan 6s linear infinite; z-index:100; pointer-events:none; }
  .sys-window { border:1px solid rgba(46,211,255,.12); background:linear-gradient(145deg,rgba(12,18,32,.96),rgba(5,9,17,.96)); overflow:hidden; animation:floatIn .35s ease both; }
  .sys-window:hover { animation:pulseGlow 2s ease-in-out infinite; }
  .tab-btn { text-transform:uppercase; transition:all .2s ease; }
  .tab-btn:active { transform:scale(.96); }
  .aesthetic-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid #1B2A45; background:#09101d; padding:6px 9px; border-radius:999px; font-size:9px; letter-spacing:1.2px; color:#9FB5D4; }
  .boss-card { background:linear-gradient(135deg,rgba(46,211,255,.10),rgba(139,111,255,.06) 50%,rgba(255,209,102,.05)); border:1px solid rgba(46,211,255,.24); }

</style>
</head>
<body>
<div class="hunter-scan"></div><div id="app"></div>

<script>
/* ============================================================
   DATA + CONFIG  (ported unchanged from the original app)
   ============================================================ */
const HUNTER_NAME = "Saksham";

const PLAN = {
  "Push A": [
    { name: "Incline Dumbbell Press", sets: 3, reps: "6-10", type: "unilateral", note: "~30° incline • upper-chest bias • left arm first" },
    { name: "Barbell Bench Press", sets: 3, reps: "6-10", type: "bilateral" },
    { name: "Lateral Raises", sets: 4, reps: "10-20", type: "bilateral", note: "Controlled • no swinging" },
    { name: "Cable Fly", sets: 2, reps: "10-15", type: "bilateral", note: "Full comfortable ROM" },
    { name: "Overhead Cable Triceps Extension", sets: 3, reps: "8-15", type: "bilateral", note: "Long-head emphasis" },
  ],
  "Pull A": [
    { name: "Pull-ups / Lat Pulldown", sets: 3, reps: "6-10", type: "bilateral", note: "Drive elbows down • full ROM" },
    { name: "Chest-Supported Row", sets: 3, reps: "8-12", type: "bilateral" },
    { name: "Single-Arm DB Row", sets: 2, reps: "8-12", type: "unilateral", note: "Left arm first" },
    { name: "Face Pulls", sets: 2, reps: "12-20", type: "bilateral" },
    { name: "Dumbbell Curl", sets: 3, reps: "8-12", type: "unilateral", note: "Left arm first" },
    { name: "Hammer Curl", sets: 2, reps: "10-15", type: "bilateral" },
  ],
  "Legs A": [
    { name: "Squat", sets: 3, reps: "6-10", type: "bilateral" },
    { name: "45° Back Extension", sets: 3, reps: "6-10", type: "bilateral", note: "Controlled stretch • neutral spine" },
    { name: "Leg Extension", sets: 2, reps: "10-15", type: "bilateral" },
    { name: "Seated Leg Curl", sets: 3, reps: "8-15", type: "bilateral", note: "Long-length hamstring bias" },
    { name: "Calf Raises", sets: 3, reps: "8-15", type: "bilateral", note: "Deep stretch • full plantarflexion" },
    { name: "Cable Crunch", sets: 3, reps: "10-15", type: "bilateral" },
  ],
  "Push B": [
    { name: "Barbell Bench Press", sets: 3, reps: "6-10", type: "bilateral" },
    { name: "Incline Dumbbell Press", sets: 2, reps: "8-12", type: "unilateral", note: "~30° incline • left arm first" },
    { name: "Lateral Raises", sets: 4, reps: "10-20", type: "bilateral", note: "Controlled • no swinging" },
    { name: "Dumbbell Overhead Press", sets: 2, reps: "8-12", type: "bilateral" },
    { name: "Cable Fly", sets: 2, reps: "10-15", type: "bilateral" },
    { name: "Triceps Pushdown / Dips", sets: 3, reps: "10-15", type: "bilateral" },
  ],
  "Pull B": [
    { name: "Neutral-Grip Lat Pulldown", sets: 3, reps: "8-12", type: "bilateral", note: "Lat-focused • don't chase grip width" },
    { name: "Barbell Row", sets: 3, reps: "6-10", type: "bilateral" },
    { name: "Straight-Arm Pulldown", sets: 2, reps: "10-15", type: "bilateral" },
    { name: "Face Pulls", sets: 2, reps: "12-20", type: "bilateral" },
    { name: "Preacher Curl", sets: 3, reps: "8-12", type: "bilateral" },
    { name: "Hammer Curl", sets: 2, reps: "10-15", type: "bilateral" },
  ],
  "Legs B": [
    { name: "Leg Press", sets: 3, reps: "8-12", type: "bilateral" },
    { name: "Bulgarian Split Squat", sets: 2, reps: "8-12", type: "unilateral", note: "Left leg first" },
    { name: "Seated Leg Curl", sets: 3, reps: "8-15", type: "bilateral" },
    { name: "Leg Extension", sets: 2, reps: "10-15", type: "bilateral" },
    { name: "Calf Raises", sets: 3, reps: "8-15", type: "bilateral" },
    { name: "Hanging Leg Raise", sets: 3, reps: "8-15", type: "bilateral" },
  ],
  Rest: [],
};

const WEEK_MAP = ["Rest", "Push A", "Pull A", "Legs A", "Push B", "Pull B", "Legs B"];
const RANKS = [
  { min: 0, label: "E", color: "#6B7A91" },
  { min: 5, label: "D", color: "#4ADE80" },
  { min: 10, label: "C", color: "#2ED3FF" },
  { min: 15, label: "B", color: "#8B6FFF" },
  { min: 20, label: "A", color: "#FF9F5A" },
  { min: 25, label: "S", color: "#FFD166" },
];

const INCREMENTS = {
  "Barbell Bench Press": 2.5,
  "Incline Dumbbell Press": 2,
  "Lateral Raises": 1,
  "Cable Fly": 2.5,
  "Overhead Cable Triceps Extension": 2.5,
  "Dumbbell Overhead Press": 2,
  "Triceps Pushdown / Dips": 2.5,
  "Pull-ups / Lat Pulldown": 2.5,
  "Chest-Supported Row": 2.5,
  "Single-Arm DB Row": 2,
  "Face Pulls": 2.5,
  "Dumbbell Curl": 1,
  "Hammer Curl": 1,
  "Neutral-Grip Lat Pulldown": 2.5,
  "Barbell Row": 2.5,
  "Straight-Arm Pulldown": 2.5,
  "Preacher Curl": 1,
  "Squat": 5,
  "45° Back Extension": 5,
  "Leg Extension": 2.5,
  "Seated Leg Curl": 2.5,
  "Calf Raises": 5,
  "Cable Crunch": 2.5,
  "Leg Press": 5,
  "Bulgarian Split Squat": 2,
  "Hanging Leg Raise": 2.5,
};

const EXERCISE_CATEGORY = {};
Object.entries(PLAN).forEach(([cat, exs]) => {
  if (cat === "Rest") return;
  const baseCat = cat.split(" ")[0];
  exs.forEach((ex) => { EXERCISE_CATEGORY[ex.name] = baseCat; });
});

/* ============================================================
   PURE HELPER FUNCTIONS (unchanged logic from original)
   ============================================================ */
function todayKey(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}
function dayTypeFor(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return WEEK_MAP[d.getDay()];
}
function fmtDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-IN", {
    weekday: "long", day: "numeric", month: "short",
  });
}
function getWeekStart(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0, 10);
}
function parseRepRange(str) {
  const m = String(str).match(/(\d+)(?:-(\d+))?/);
  if (!m) return { min: 8, max: 12 };
  const min = parseInt(m[1], 10);
  const max = m[2] ? parseInt(m[2], 10) : min;
  return { min, max };
}
function extractPairs(sets, sideKey) {
  const out = [];
  (sets || []).forEach((s) => {
    if (!s) return;
    if (sideKey) {
      const side = s[sideKey];
      if (side && side.w !== "" && side.r !== "" && side.w != null && side.r != null) {
        out.push({ w: Number(side.w), r: Number(side.r) });
      }
    } else if (s.w !== "" && s.r !== "" && s.w != null && s.r != null) {
      out.push({ w: Number(s.w), r: Number(s.r) });
    }
  });
  return out;
}
function roundStep(v) { return Math.round(v * 2) / 2; }
function evaluateSets(pairs, range, increment) {
  const lastWeight = pairs[pairs.length - 1].w;
  const minReps = Math.min(...pairs.map((p) => p.r));
  if (minReps >= range.max) {
    return { status: "increase-weight", weight: roundStep(lastWeight + increment), reps: range.min, lastWeight, lastReps: minReps };
  }
  if (minReps >= range.min) {
    return { status: "increase-reps", weight: lastWeight, reps: Math.min(minReps + 1, range.max), lastWeight, lastReps: minReps };
  }
  return { status: "hold", weight: lastWeight, reps: range.min, lastWeight, lastReps: minReps };
}
function checkPlateau(history, sideKey) {
  const lastN = history.slice(-3);
  if (lastN.length < 3) return false;
  const stats = lastN.map((h) => {
    const pairs = extractPairs(h.sets, sideKey);
    if (!pairs.length) return null;
    return { weight: pairs[pairs.length - 1].w, minReps: Math.min(...pairs.map((p) => p.r)) };
  });
  if (stats.some((s) => !s)) return false;
  const sameWeight = stats.every((s) => s.weight === stats[0].weight);
  const repsNotImproving = stats[2].minReps <= stats[0].minReps;
  return sameWeight && repsNotImproving;
}
function evaluateSideHistory(history, sideKey, range, increment) {
  if (!history.length) return { status: "no-data" };
  const last = history[history.length - 1];
  const pairs = extractPairs(last.sets, sideKey);
  if (!pairs.length) return { status: "no-data" };
  const evalNow = evaluateSets(pairs, range, increment);
  evalNow.plateau = checkPlateau(history, sideKey);
  return evalNow;
}
function buildSuggestion(ex, combinedLogs, excludeDate) {
  const history = Object.entries(combinedLogs)
    .filter(([d]) => d !== excludeDate)
    .filter(([, exs]) => exs && exs[ex.name] && exs[ex.name].length)
    .map(([d, exs]) => ({ date: d, sets: exs[ex.name] }))
    .sort((a, b) => a.date.localeCompare(b.date));

  const range = parseRepRange(ex.reps);
  const increment = INCREMENTS[ex.name] || 2.5;

  if (ex.type === "bilateral") {
    return { type: "bilateral", main: evaluateSideHistory(history, null, range, increment) };
  }
  if (ex.type === "left-only") {
    return { type: "left-only", L: evaluateSideHistory(history, "L", range, increment) };
  }
  return {
    type: "unilateral",
    L: evaluateSideHistory(history, "L", range, increment),
    R: evaluateSideHistory(history, "R", range, increment),
  };
}
function computeWeeklyVolume(combinedLogs) {
  const weeks = {};
  Object.entries(combinedLogs).forEach(([d, exs]) => {
    if (!exs) return;
    const ws = getWeekStart(d);
    Object.entries(exs).forEach(([exName, sets]) => {
      const cat = EXERCISE_CATEGORY[exName];
      if (!cat) return;
      let vol = 0;
      (sets || []).forEach((s) => {
        if (!s) return;
        if (s.w && s.r) vol += Number(s.w) * Number(s.r);
        if (s.L && s.L.w && s.L.r) vol += Number(s.L.w) * Number(s.L.r);
        if (s.R && s.R.w && s.R.r) vol += Number(s.R.w) * Number(s.R.r);
      });
      if (!weeks[ws]) weeks[ws] = { week: ws, Push: 0, Pull: 0, Legs: 0 };
      weeks[ws][cat] += vol;
    });
  });
  return Object.values(weeks).sort((a, b) => a.week.localeCompare(b.week)).slice(-4);
}
function computeBalance(weeklyData) {
  if (!weeklyData.length) return { flag: false };
  const last = weeklyData[weeklyData.length - 1];
  const vals = [last.Push, last.Pull, last.Legs];
  const max = Math.max(...vals);
  const min = Math.min(...vals);
  if (max === 0) return { flag: false };
  if (min < max * 0.6) {
    const cats = ["Push", "Pull", "Legs"];
    const minCat = cats[vals.indexOf(min)];
    return {
      flag: true,
      text: `${minCat} volume is noticeably behind the others this week — an illustrative pattern from your logs, not a diagnosis. Consider prioritizing ${minCat.toLowerCase()} a little harder in your next session.`,
    };
  }
  return { flag: false };
}
function esc(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ============================================================
   STORAGE (localStorage — synchronous, fully offline)
   ============================================================ */
const Store = {
  get(key) {
    try {
      const v = localStorage.getItem(key);
      return v == null ? null : JSON.parse(v);
    } catch (e) { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  },
  allWorkoutLogs() {
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf("workout:") === 0) {
        const d = k.replace("workout:", "");
        const v = Store.get(k);
        if (v) out[d] = v;
      }
    }
    return out;
  }
};

/* ============================================================
   APP STATE
   ============================================================ */
const date = todayKey();
const dayType = dayTypeFor(date);

const State = {
  tab: "Status",
  todayLog: Store.get(`workout:${date}`) || {},
  allLogs: Store.allWorkoutLogs(),
  bwHistory: Store.get("bodyweight-history") || [],
  nutrition: Store.get("nutrition-log") || {},
  showBackup: false,
  importMsg: "",
  levelUpFlash: false,
  prevLevel: null,
};
// make sure today's log is present in allLogs too
State.allLogs[date] = State.todayLog;

function saveTodayLog(next) {
  State.todayLog = next;
  State.allLogs[date] = next;
  Store.set(`workout:${date}`, next);
}
function updateBilateral(exName, idx, field, value) {
  const next = { ...State.todayLog };
  const sets = next[exName] ? [...next[exName]] : [];
  while (sets.length <= idx) sets.push({ w: "", r: "" });
  sets[idx] = { ...sets[idx], [field]: value };
  next[exName] = sets;
  saveTodayLog(next);
}
function updateUnilateral(exName, idx, side, field, value) {
  const next = { ...State.todayLog };
  const sets = next[exName] ? [...next[exName]] : [];
  while (sets.length <= idx) sets.push({ L: { w: "", r: "" }, R: { w: "", r: "" } });
  const set = { ...sets[idx] };
  set[side] = { ...(set[side] || { w: "", r: "" }), [field]: value };
  sets[idx] = set;
  next[exName] = sets;
  saveTodayLog(next);
}
function saveBodyweight() {
  const input = document.getElementById("bwInput");
  const val = parseFloat(input.value);
  if (!val || val <= 0) return;
  const next = [...State.bwHistory.filter((e) => e.date !== date), { date, weight: val }]
    .sort((a, b) => a.date.localeCompare(b.date));
  State.bwHistory = next;
  Store.set("bodyweight-history", next);
  render();
}
function toggleNutrition(field) {
  const day = State.nutrition[date] || { protein: false, surplus: false, sleep: false };
  const next = { ...State.nutrition, [date]: { ...day, [field]: !day[field] } };
  State.nutrition = next;
  Store.set("nutrition-log", next);
  render();
}
function handleRestore() {
  const ta = document.getElementById("importTextArea");
  try {
    const parsed = JSON.parse(ta.value);
    if (parsed.allLogs) {
      State.allLogs = parsed.allLogs;
      Object.entries(parsed.allLogs).forEach(([d, log]) => Store.set(`workout:${d}`, log));
      State.todayLog = parsed.allLogs[date] || State.todayLog;
    }
    if (parsed.bwHistory) { State.bwHistory = parsed.bwHistory; Store.set("bodyweight-history", parsed.bwHistory); }
    if (parsed.nutrition) { State.nutrition = parsed.nutrition; Store.set("nutrition-log", parsed.nutrition); }
    State.importMsg = "Restored successfully.";
  } catch (e) {
    State.importMsg = "That doesn't look like valid backup text — paste the exact text from a previous Copy Backup.";
  }
  render();
}
function setTab(t) { State.tab = t; render(); }
function toggleBackup() { State.showBackup = !State.showBackup; render(); }

/* ============================================================
   DERIVED / COMPUTED VALUES
   ============================================================ */
function computeAll() {
  const combinedLogs = { ...State.allLogs, [date]: State.todayLog };

  let totalXP = 0, totalVolume = 0;
  const sessionDates = new Set();
  Object.entries(combinedLogs).forEach(([d, exs]) => {
    Object.values(exs || {}).forEach((sets) => {
      (sets || []).forEach((s) => {
        if (s && s.w && s.r) { totalXP += 10; totalVolume += Number(s.w) * Number(s.r); sessionDates.add(d); }
        if (s && s.L && s.L.w && s.L.r) { totalXP += 10; totalVolume += Number(s.L.w) * Number(s.L.r); sessionDates.add(d); }
        if (s && s.R && s.R.w && s.R.r) { totalXP += 10; totalVolume += Number(s.R.w) * Number(s.R.r); sessionDates.add(d); }
      });
    });
  });

  const suggestions = {};
  Object.values(PLAN).flat().forEach((ex) => { suggestions[ex.name] = buildSuggestion(ex, combinedLogs, date); });

  const weeklyVolume = computeWeeklyVolume(combinedLogs);
  const balance = computeBalance(weeklyVolume);

  const level = Math.floor(totalXP / 100) + 1;
  const xpIntoLevel = totalXP % 100;
  const rank = [...RANKS].reverse().find((r) => level >= r.min) || RANKS[0];

  if (State.prevLevel !== null && level > State.prevLevel) {
    State.levelUpFlash = true;
    setTimeout(() => { State.levelUpFlash = false; render(); }, 2400);
  }
  State.prevLevel = level;

  const latestBw = State.bwHistory.length ? State.bwHistory[State.bwHistory.length - 1].weight : null;
  const startBw = State.bwHistory.length ? State.bwHistory[0].weight : null;
  const bwGain = latestBw && startBw ? latestBw - startBw : 0;

  let streak = 0;
  for (let i = 0; i < 60; i++) {
    const dt = todayKey(-i);
    const dType = dayTypeFor(dt);
    if (dType === "Rest") continue;
    if (sessionDates.has(dt)) streak++;
    else if (i === 0) continue;
    else break;
  }

  const STR = Math.min(100, Math.round(totalVolume / 250));
  const VIT = Math.min(100, Math.round(streak * 8));
  const END = Math.min(100, Math.round(sessionDates.size * 4));
  const PHY = Math.min(100, Math.max(0, Math.round(bwGain * 18)));

  const plan = PLAN[dayType] || [];
  let done = 0, total = 0;
  plan.forEach((ex) => {
    const sets = State.todayLog[ex.name] || [];
    if (ex.type === "bilateral") {
      total += ex.sets;
      for (let i = 0; i < ex.sets; i++) if (sets[i] && sets[i].w && sets[i].r) done++;
    } else if (ex.type === "unilateral") {
      total += ex.sets * 2;
      for (let i = 0; i < ex.sets; i++) {
        const s = sets[i];
        if (s && s.L && s.L.w && s.L.r) done++;
        if (s && s.R && s.R.w && s.R.r) done++;
      }
    } else if (ex.type === "left-only") {
      total += ex.sets;
      for (let i = 0; i < ex.sets; i++) if (sets[i] && sets[i].L && sets[i].L.w && sets[i].L.r) done++;
    }
  });
  const completion = { done, total };
  const questComplete = total > 0 && done === total;

  return { combinedLogs, totalXP, totalVolume, sessionDates, suggestions, weeklyVolume, balance, level, xpIntoLevel, rank, latestBw, startBw, bwGain, streak, STR, VIT, END, PHY, completion, questComplete };
}

function sysWindow(accent, innerHTML, extraStyle) {

    <span class="sys-corner" style="top:-1px; right:-1px; border-top:2px solid ${accent}; border-right:2px solid ${accent};"></span>
    <span class="sys-corner" style="bottom:-1px; left:-1px; border-bottom:2px solid ${accent}; border-left:2px solid ${accent};"></span>
    <span class="sys-corner" style="bottom:-1px; right:-1px; border-bottom:2px solid ${accent}; border-right:2px solid ${accent};"></span>
    ${innerHTML}
  </div>`;
}
function sectionLabel(text, accent) {
  accent = accent || "#2ED3FF";
  return `<div class="sys-font" style="font-size:11px; letter-spacing:3px; color:${accent}; margin-bottom:10px; font-weight:700;">${esc(text)}</div>`;
}
function statBar(label, value, color) {
  return `<div style="margin-bottom:12px;">
    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
      <span class="sys-font" style="font-size:11px; letter-spacing:1.5px; color:#8FA3C4;">${esc(label)}</span>
      <span class="num" style="font-size:12px; color:${color}; font-weight:700;">${value}</span>
    </div>
    <div style="height:6px; background:#0F1830; border-radius:3px; overflow:hidden; border:1px solid #1B2A45;">
      <div style="height:100%; width:${value}%; background:linear-gradient(90deg, ${color}88, ${color}); box-shadow:0 0 8px ${color}99; transition:width 0.6s ease-out;"></div>
    </div>
  </div>`;
}
function miniStat(label, value, accent) {
  return `<div class="mini-stat" style="border:1px solid ${accent}44;">
    <div class="num" style="font-size:17px; font-weight:700; color:${accent};">${esc(String(value))}</div>
    <div style="font-size:9px; color:#5E7291; letter-spacing:1px; margin-top:3px;">${esc(label)}</div>
  </div>`;
}
function statusColor(status) {
  switch (status) {
    case "increase-weight": return "#4ADE80";
    case "increase-reps": return "#2ED3FF";
    case "hold": return "#FFD166";
    default: return "#5E7291";
  }
}
function statusText(s) {
  if (s.status === "no-data") return "No history yet — log today as your baseline";
  if (s.status === "increase-weight") return `\u2191 Weight \u2192 ${s.weight}kg \u00d7 ${s.reps} reps (hit ${s.lastReps} reps @ ${s.lastWeight}kg last time)`;
  if (s.status === "increase-reps") return `\u2191 Reps \u2192 aim ${s.reps} reps @ ${s.weight}kg (hit ${s.lastReps} last time)`;
  if (s.status === "hold") return `Hold \u2192 repeat ${s.weight}kg, aim ${s.reps}+ reps (missed target range last time)`;
  return "";
}
function suggestionLine(label, s) {
  if (!s) return "";
  let html = `<div style="margin-bottom:4px;">
    <div style="display:flex; gap:6px; align-items:flex-start;">
      ${label ? `<span class="num" style="font-size:10px; color:${statusColor(s.status)}; flex-shrink:0; margin-top:1px;">${label}</span>` : ""}
      <span class="body-font" style="font-size:12px; color:${statusColor(s.status)}; line-height:1.4;">${esc(statusText(s))}</span>
    </div>`;
  if (s.plateau) {
    html += `<div class="body-font" style="font-size:11px; color:#8B6FFF; margin-top:2px;">\u26A0 Plateaued — same weight & reps for 3 sessions straight. Consider a light deload (~10% less weight) or swapping the exercise for a week or two.</div>`;
  }
  html += `</div>`;
  return html;
}
function exerciseSuggestion(suggestion) {
  if (!suggestion) return "";
  if (suggestion.type === "bilateral") return suggestionLine(null, suggestion.main);
  if (suggestion.type === "left-only") return suggestionLine("L", suggestion.L);

  const rankMap = { "no-data": 0, hold: 1, "increase-reps": 2, "increase-weight": 3 };
  const rL = rankMap[suggestion.L.status] ?? 0;
  const rR = rankMap[suggestion.R.status] ?? 0;
  const asymmetry = suggestion.L.status !== "no-data" && suggestion.R.status !== "no-data" && rL !== rR;
  const weakerSide = rL < rR ? "left" : "right";
  let html = `<div>${suggestionLine("L", suggestion.L)}${suggestionLine("R", suggestion.R)}`;
  if (asymmetry) {
    html += `<div class="body-font" style="font-size:11px; color:#FF9F5A; margin-top:2px;">Pace by the ${weakerSide} side — hold both there until it catches up, then progress together.</div>`;
  }
  html += `</div>`;
  return html;
}

/* ============================================================
   HAND-ROLLED SVG CHARTS (no chart library — fully offline)
   ============================================================ */
function barChart(weeklyVolume) {
  const w = 320, h = 190, padL = 30, padB = 20, padT = 10, padR = 10;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const maxVal = Math.max(1, ...weeklyVolume.flatMap(d => [d.Push, d.Pull, d.Legs]));
  const groupW = plotW / weeklyVolume.length;
  const barW = groupW / 4;
  const colors = { Push: "#2ED3FF", Pull: "#8B6FFF", Legs: "#FFD166" };
  let bars = "";
  weeklyVolume.forEach((d, gi) => {
    ["Push", "Pull", "Legs"].forEach((cat, ci) => {
      const val = d[cat] || 0;
      const barH = (val / maxVal) * plotH;
      const x = padL + gi * groupW + ci * barW + barW * 0.15;
      const y = padT + plotH - barH;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barW*0.7).toFixed(1)}" height="${barH.toFixed(1)}" fill="${colors[cat]}" rx="1"/>`;
    });
  });
  let gridLines = "";
  for (let i = 0; i <= 3; i++) {
    const y = padT + (plotH / 3) * i;
    gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="#1B2A45" stroke-dasharray="3 3"/>`;
  }
  let labels = "";
  weeklyVolume.forEach((d, gi) => {
    const x = padL + gi * groupW + groupW / 2;
    labels += `<text x="${x.toFixed(1)}" y="${h - 4}" fill="#5E7291" font-size="9" text-anchor="middle">${esc(d.week.slice(5))}</text>`;
  });
  const legend = `
    <span style="display:inline-flex; align-items:center; gap:4px; margin-right:12px;"><span style="width:8px;height:8px;background:#2ED3FF;display:inline-block;border-radius:1px;"></span><span style="font-size:10px;color:#8FA3C4;">Push</span></span>
    <span style="display:inline-flex; align-items:center; gap:4px; margin-right:12px;"><span style="width:8px;height:8px;background:#8B6FFF;display:inline-block;border-radius:1px;"></span><span style="font-size:10px;color:#8FA3C4;">Pull</span></span>
    <span style="display:inline-flex; align-items:center; gap:4px;"><span style="width:8px;height:8px;background:#FFD166;display:inline-block;border-radius:1px;"></span><span style="font-size:10px;color:#8FA3C4;">Legs</span></span>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:190px; display:block;">${gridLines}${bars}${labels}</svg>
    <div style="text-align:center; margin-top:6px;">${legend}</div>`;
}
function lineChart(history) {
  const w = 320, h = 200, padL = 32, padB = 22, padT = 10, padR = 12;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const vals = history.map(h2 => h2.weight);
  const minV = Math.min(...vals) - 1, maxV = Math.max(...vals) + 1;
  const range = maxV - minV || 1;
  const pts = history.map((d, i) => {
    const x = padL + (i / (history.length - 1)) * plotW;
    const y = padT + plotH - ((d.weight - minV) / range) * plotH;
    return { x, y, d };
  });
  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  let gridLines = "";
  for (let i = 0; i <= 3; i++) {
    const y = padT + (plotH / 3) * i;
    gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="#1B2A45" stroke-dasharray="3 3"/>`;
  }
  const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#2ED3FF"/>`).join("");
  let labels = "";
  const step = Math.max(1, Math.floor(pts.length / 5));
  pts.forEach((p, i) => {
    if (i % step === 0 || i === pts.length - 1) {
      labels += `<text x="${p.x.toFixed(1)}" y="${h - 4}" fill="#5E7291" font-size="9" text-anchor="middle">${esc(p.d.date.slice(5))}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:200px; display:block;">
    ${gridLines}
    <path d="${pathD}" fill="none" stroke="#2ED3FF" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}

function renderExerciseCard(ex, suggestion) {
  const sets = State.todayLog[ex.name] || [];
  const isBilateral = ex.type === "bilateral";
  const isLeftOnly = ex.type === "left-only";
  const noteHtml = ex.note ? `<div style="display:inline-block; font-size:10px; color:#FFD166; letter-spacing:0.5px; background:#1F1A0E; border:1px solid #4A3F1E; border-radius:2px; padding:2px 8px; margin-bottom:8px;">${esc(ex.note.toUpperCase())}</div>` : "";

  let rowsHtml = "";
  if (isBilateral) {
    let rows = "";
    for (let i = 0; i < ex.sets; i++) {
      const s = sets[i] || { w: "", r: "" };
      rows += `<div style="display:grid; grid-template-columns:16px 1fr 12px 1fr; gap:6px; align-items:center;">
        <span class="num" style="font-size:11px; color:#5E7291;">${i + 1}</span>

        <span style="color:#3A4A6A; text-align:center;">×</span>
        <input type="number" inputmode="numeric" placeholder="reps" class="num input-cell" value="${s.r === "" || s.r == null ? "" : s.r}" data-ex="${esc(ex.name)}" data-idx="${i}" data-field="r" data-mode="bilateral">
      </div>`;
    }
    rowsHtml = `<div style="display:flex; flex-direction:column; gap:6px;">${rows}</div>`;
  } else if (ex.type === "unilateral") {
    let rows = "";

          </div>
          ${exerciseSuggestion(c.suggestions[ex.name])}
        `, "margin-bottom:8px; padding:12px 14px;");
      });
    });
    html += `</div>`;
  });

  html += `<p class="body-font" style="font-size:11px; color:#5E7291; margin-top:4px; line-height:1.6;">
    Suggestions use double-progression logic on your last logged session for each exercise: hit the top of the rep range on every set → add weight; land inside the range → add a rep; miss the bottom of the range → hold and repeat. It's a starting recommendation, not a command — you know your body and gym on any given day.
  </p>`;
  return html;
}

function renderGrowthTab(c) {
  const history = State.bwHistory;
  let html = sysWindow("#FFD166", `
    ${sectionLabel("MASS TRACKING", "#FFD166")}
    <div style="display:flex; gap:8px;">
      <input id="bwInput" type="number" inputmode="decimal" placeholder="Today's weight (kg)" class="num input-cell" style="flex:1; text-align:left;">
      <button onclick="saveBodyweight()" class="sys-font" style="background:#FFD166; border:none; border-radius:2px; color:#05070C; font-weight:700; padding:0 18px; font-size:12px; letter-spacing:1px; cursor:pointer;">LOG</button>
    </div>
  `, "margin-bottom:16px;");

  if (history.length > 0) {
    html += `<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px;">
      ${miniStat("LATEST", `${c.latestBw}kg`, "#DCEFFF")}
      ${miniStat("GAINED", `${c.bwGain > 0 ? "+" : ""}${c.bwGain.toFixed(1)}kg`, c.bwGain >= 0 ? "#4ADE80" : "#FF9F9F")}
      ${miniStat("ENTRIES", history.length, "#8FA3C4")}
    </div>`;
  }

  html += sysWindow("#2ED3FF", `
    ${sectionLabel("GROWTH CURVE", "#2ED3FF")}
    ${history.length >= 2 ? lineChart(history) : `<p class="body-font" style="color:#5E7291; font-size:13px; text-align:center; padding:24px 0;">Log at least 2 entries to reveal your growth curve.</p>`}
  `);

  html += `<p class="body-font" style="font-size:12px; color:#5E7291; margin-top:14px; line-height:1.6;">
    Use the curve to judge your trend. If bodyweight is not moving toward your intended goal for several weeks, review food intake before adding more training volume.
  </p>`;
  return html;
}

function renderRecoveryTab() {
  const today = State.nutrition[date] || {};
  const items = [
    { key: "protein", label: "Protein target hit", hint: "Your planned daily protein target" },
    { key: "surplus", label: "Ate in a calorie surplus", hint: "4-5 meals across the day" },
    { key: "sleep", label: "Slept 7-8 hours", hint: "recovery window — non-negotiable" },
  ];
  const allDone = items.every((it) => today[it.key]);

  let html = sysWindow(allDone ? "#4ADE80" : "#8B6FFF", `
    ${sectionLabel(allDone ? "RECOVERY COMPLETE" : "RECOVERY CHECKLIST", allDone ? "#4ADE80" : "#8B6FFF")}
    <p class="body-font" style="font-size:13px; color:#B8C7DE; margin:0; line-height:1.5;">This is where STR and PHYSIQUE stats actually get built — training only creates the demand.</p>
  `, "margin-bottom:14px;");

  items.forEach((it) => {
    const checked = !!today[it.key];
    html += `<button onclick="toggleNutrition('${it.key}')" class="checklist-btn" style="border:1px solid ${checked ? "#4ADE80" : "#1B2A45"};">
      <div style="width:20px; height:20px; border-radius:3px; flex-shrink:0; background:${checked ? "#4ADE80" : "transparent"}; border:1px solid ${checked ? "#4ADE80" : "#3A4A6A"}; display:flex; align-items:center; justify-content:center;">
        ${checked ? `<span style="color:#05070C; font-size:13px; font-weight:700;">✓</span>` : ""}
      </div>
      <div>
        <div class="body-font" style="font-size:14px; font-weight:700; color:#DCEFFF;">${esc(it.label)}</div>
        <div style="font-size:12px; color:#5E7291; margin-top:2px;">${esc(it.hint)}</div>
      </div>
    </button>`;
  });
  return html;
}

/* ============================================================
   TOP-LEVEL RENDER
   ============================================================ */
function render() {
  const c = computeAll();
  const tabs = ["Status", "Quests", "Intel", "Growth", "Recovery"];
  let body;
  if (State.tab === "Status") body = renderStatusTab(c);
  else if (State.tab === "Quests") body = renderQuestsTab(c);
  else if (State.tab === "Intel") body = renderIntelTab(c);
  else if (State.tab === "Growth") body = renderGrowthTab(c);
  else body = renderRecoveryTab();

  const navHtml = tabs.map(t => `<button class="tab-btn sys-font" onclick="setTab('${t}')" style="border-bottom:${State.tab === t ? "2px solid #2ED3FF" : "2px solid transparent"}; color:${State.tab === t ? "#DCEFFF" : "#5E7291"};">${t.toUpperCase()}</button>`).join("");

  const levelUpHtml = State.levelUpFlash ? `
    <div style="position:fixed; top:18%; left:50%; transform:translateX(-50%); z-index:50; text-align:center; animation:popIn 0.4s ease-out; pointer-events:none;">
      <div class="sys-font glow-text" style="font-size:13px; letter-spacing:4px; color:#2ED3FF;">LEVEL UP</div>
      <div class="sys-font" style="font-size:48px; font-weight:900; color:#DCEFFF; text-shadow:0 0 30px #2ED3FF;">${c.level}</div>
    </div>` : "";

  document.getElementById("app").innerHTML = `
    <div style="min-height:100vh; background:radial-gradient(ellipse at 50% -10%, #0D1830 0%, #05070C 55%); color:#DCEFFF; padding-bottom:50px;">
      ${levelUpHtml}
      <header style="padding:18px 18px 16px; border-bottom:1px solid #1B2A45;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <div style="display:flex; align-items:center; gap:12px; min-width:0;">
            <div style="width:58px; height:58px; flex:0 0 58px; border-radius:16px; overflow:hidden; border:1px solid rgba(139,111,255,.75); box-shadow:0 0 18px rgba(139,111,255,.25); background:#05070C;">
              <img src="./icon-192.png" alt="HUNTER SYSTEM" style="width:100%; height:100%; display:block; object-fit:cover;">
            </div>
            <div style="min-width:0;">
              <div class="sys-font" style="font-size:10px; letter-spacing:3px; color:#8B6FFF;">THE SYSTEM</div>
              <h1 class="sys-font glow-text" style="margin:2px 0 0; font-size:22px; font-weight:900; letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">HUNTER: ${esc(HUNTER_NAME.toUpperCase())}</h1>
            </div>
          </div>
          <div style="text-align:right;">
            <div class="sys-font" style="font-size:20px; font-weight:900; color:${c.rank.color}; text-shadow:0 0 14px ${c.rank.color}88;">${c.rank.label}</div>
            <div style="font-size:10px; color:#5E7291; letter-spacing:1px;">RANK</div>
          </div>
        </div>
        <div style="font-size:12px; color:#5E7291; margin-top:6px;">${esc(fmtDate(date))}</div>
      </header>

      <nav style="display:flex; border-bottom:1px solid #1B2A45; background:#080B12;">${navHtml}</nav>

      <main style="padding:18px;">${body}</main>
    </div>
  `;
  attachInputListeners();
}

function attachInputListeners() {
  document.querySelectorAll('input[data-ex]').forEach((input) => {
    input.addEventListener('change', (e) => {
      const el = e.target;
      const exName = el.getAttribute('data-ex');
      const idx = parseInt(el.getAttribute('data-idx'), 10);
      const field = el.getAttribute('data-field');
      const mode = el.getAttribute('data-mode');
      const value = el.value;
      if (mode === 'bilateral') {
        updateBilateral(exName, idx, field, value);
      } else {
        const side = el.getAttribute('data-side');
        updateUnilateral(exName, idx, side, field, value);
      }
      render();
    });
  });
}

render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", {scope:"./"}).catch(()=>{}));
}
</script>
</body>
</html>
